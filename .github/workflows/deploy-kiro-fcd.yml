name: Deploy Kiro First Call Deck

on:
  push:
    branches: [main]
    paths:
      - "ai-coding-assistants/kiro-fcd/**"
      - ".github/workflows/deploy-kiro-fcd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiro-fcd-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate self-contained deck
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          import gzip
          import json
          import re

          source = Path("ai-coding-assistants/kiro-fcd/index.html").read_text()
          def bundled(kind):
              match = re.search(r'<script type="__bundler/' + kind + r'">(.*?)</script>', source, re.S)
              assert match, f"Missing bundled block: {kind}"
              return json.loads(match[1])
          template = bundled("template")
          slides = re.findall(r'<section class="dk-slide\b.*?</section>', template, re.S)
          assert len(slides) == 57, f"Expected 57 slides, got {len(slides)}"
          assert all("deck-standard-footer" in slide for slide in slides)
          manifest = bundled("manifest")
          for asset in manifest.values():
              payload = base64.b64decode(asset["data"], validate=True)
              if asset.get("compressed"):
                  payload = gzip.decompress(payload)
              assert payload, "Empty embedded asset"
          assert all(entry["uuid"] in manifest for entry in bundled("ext_resources"))
          assert all(page_id in manifest for page_id in bundled("page_order"))
          print(f"Validated {len(slides)} slides and {len(manifest)} embedded resources")
          PYTHON

      - name: Prepare presentation site
        run: |
          mkdir -p _site/ai-coding-assistants/kiro-fcd
          cp -R ai-coding-assistants/kiro-fcd/. _site/ai-coding-assistants/kiro-fcd/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=ai-coding-assistants/kiro-fcd/">
            <title>Kiro First Call Deck</title>
          </head>
          <body><a href="ai-coding-assistants/kiro-fcd/">Kiro First Call Deck 열기</a></body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload presentation site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
